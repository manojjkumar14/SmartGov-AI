<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartGov AI Architecture</title>

<style>

body{

    margin:0;
    padding:40px;
    background:#f4f7fb;
    font-family:Arial, Helvetica, sans-serif;

}

h1{

    text-align:center;
    color:#198754;
    margin-bottom:50px;

}

.container{

    display:flex;
    flex-direction:column;
    align-items:center;

}

.box{

    width:320px;
    background:white;
    color:#222;
    text-align:center;
    padding:18px;
    margin:8px 0;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
    border-left:6px solid #198754;

}

.arrow{

    font-size:35px;
    color:#198754;
    font-weight:bold;

}

.branch{

    display:flex;
    justify-content:center;
    gap:80px;
    margin:15px 0;

}

.small-box{

    width:260px;
    background:white;
    text-align:center;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    box-shadow:0 6px 15px rgba(0,0,0,.1);
    border-left:5px solid #0d6efd;

}

</style>

</head>

<body>

<h1>SmartGov AI - System Architecture</h1>

<div class="container">

<div class="box">
👤 User
</div>

<div class="arrow">⬇</div>

<div class="box">
💻 HTML / CSS / Bootstrap UI
</div>

<div class="arrow">⬇</div>

<div class="box">
⚡ JavaScript (Fetch API)
</div>

<div class="arrow">⬇</div>

<div class="box">
🐍 Flask Backend
</div>

<div class="arrow">⬇</div>

<div class="branch">

<div class="small-box">
🗄 SQLite Database
</div>

<div class="small-box">
🤖 Google Gemini API
</div>

</div>

<div class="arrow">⬇</div>

<div class="box">
📨 AI Response
</div>

<div class="arrow">⬇</div>

<div class="box">
🖥 User Interface
</div>

</div>

</body>
</html>
